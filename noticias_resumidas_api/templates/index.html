<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Notícias Resumidas</title>
</head>
<body class="bg-light">
<div id="spinner" class="text-center mt-5">
    <div class="spinner-border text-dark" role='status'></div>
    <p class='mt-2'>Buscando e resumindo notícias...</p>
</div>
<div id='conteudo' style='display:none'>
  <div class="container mt-4">
    <nav class="navbar navbar-dark bg-dark justify-content-center">
            <span class="navbar-brand">Notícias Resumidas com IA</span>
    </nav>
    {% for noticia in noticias %}
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ noticia.titulo }}</h5>
        <small class="text-muted">{{ noticia.fonte }} • {{ noticia.data }}</small>
        <p class="card-text text-justify">{{ noticia.resumo }}</p>
        <a href="{{ noticia.url }}" target="_blank">Ler notícia completa</a>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
<script>
    window.onload = function() {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('conteudo').style.display = 'block';
    }
</script>
</body>
</html>
